{% extends "base.html" %}
{% block content %}
<article class="page risk-page" id="risk-app"
  data-low="{{ t.risk_result_low }}"
  data-moderate="{{ t.risk_result_moderate }}"
  data-high="{{ t.risk_result_high }}"
  data-low-text="{{ t.risk_low_text }}"
  data-moderate-text="{{ t.risk_moderate_text }}"
  data-high-text="{{ t.risk_high_text }}"
  data-gauge-low="{{ t.risk_gauge_low }}"
  data-gauge-mod="{{ t.risk_gauge_mod }}"
  data-gauge-high="{{ t.risk_gauge_high }}"
  data-progress-text="{{ t.risk_progress }}"
  data-lang="{{ lang }}"
  data-ask-ai="{{ t.nav_assistant }}">
  
  <header class="risk-header">
    <h1>{{ t.risk_title }}</h1>
    <p class="lead">{{ t.risk_intro }}</p>
  </header>

  <!-- Live Progress Tracker -->
  <div class="risk-progress-container" id="risk-progress-box">
    <div class="risk-progress-header">
      <span class="risk-progress-label">Сұрақтарға жауап:</span>
      <span class="risk-progress-count" id="risk-progress-count">0 / {{ questions|length }}</span>
    </div>
    <div class="risk-progress-track">
      <div class="risk-progress-bar" id="risk-progress-bar" style="width: 0%"></div>
    </div>
  </div>

  <form id="risk-form" class="risk-form" novalidate>
    {% for q in questions %}
    <fieldset class="risk-q" data-id="{{ q.id }}" data-urgent="{{ q.urgent_if_yes|yesno:'1,0' }}" data-medical="{{ q.medical_if_yes|yesno:'1,0' }}">
      <legend>
        <span class="q-badge">{{ forloop.counter }}</span>
        <span class="q-text">{{ q.text }}</span>
      </legend>
      <div class="choice-row" role="radiogroup" aria-label="{{ q.text }}">
        <label class="choice-label"><input type="radio" name="{{ q.id }}" value="yes"> <span>{{ t.answer_yes }}</span></label>
        <label class="choice-label"><input type="radio" name="{{ q.id }}" value="no"> <span>{{ t.answer_no }}</span></label>
        <label class="choice-label"><input type="radio" name="{{ q.id }}" value="unsure"> <span>{{ t.answer_unsure }}</span></label>
        <label class="choice-label"><input type="radio" name="{{ q.id }}" value="skip"> <span>{{ t.answer_skip }}</span></label>
      </div>
    </fieldset>
    {% endfor %}
    
    <div class="actions">
      <button type="button" class="btn primary" id="risk-show">{{ t.risk_see_result }}</button>
      <button type="button" class="btn ghost" id="risk-reset">{{ t.risk_reset }}</button>
    </div>
  </form>

  <div id="risk-result" class="result-box" hidden role="status" aria-live="polite"></div>
</article>
{% endblock %}
{% block scripts %}
<script src="/static/js/risk.js?v=3.1" defer></script>
{% endblock %}
