{% extends "base.html" %}
{% block content %}
<article class="page" id="risk-app"
  data-low="{{ t.risk_result_low }}"
  data-moderate="{{ t.risk_result_moderate }}"
  data-high="{{ t.risk_result_high }}"
  data-low-text="{{ t.risk_low_text }}"
  data-moderate-text="{{ t.risk_moderate_text }}"
  data-high-text="{{ t.risk_high_text }}"
  data-call102="102"
  data-call112="112"
  data-call103="103">
  <h1>{{ t.risk_title }}</h1>
  <p class="lead">{{ t.risk_intro }}</p>

  <form id="risk-form" class="risk-form" novalidate>
    {% for q in questions %}
    <fieldset class="risk-q" data-id="{{ q.id }}" data-urgent="{{ q.urgent_if_yes|yesno:'1,0' }}" data-medical="{{ q.medical_if_yes|yesno:'1,0' }}">
      <legend>{{ forloop.counter }}. {{ q.text }}</legend>
      <div class="choice-row" role="radiogroup" aria-label="{{ q.text }}">
        <label><input type="radio" name="{{ q.id }}" value="yes"> {{ t.answer_yes }}</label>
        <label><input type="radio" name="{{ q.id }}" value="no"> {{ t.answer_no }}</label>
        <label><input type="radio" name="{{ q.id }}" value="unsure"> {{ t.answer_unsure }}</label>
        <label><input type="radio" name="{{ q.id }}" value="skip"> {{ t.answer_skip }}</label>
      </div>
    </fieldset>
    {% endfor %}
    <div class="actions">
      <button type="button" class="btn primary" id="risk-show">{{ t.risk_see_result }}</button>
      <button type="button" class="btn ghost" id="risk-reset">{{ t.risk_reset }}</button>
    </div>
  </form>

  <div id="risk-result" class="result-box" hidden role="status" aria-live="polite"></div>
</article>
{% endblock %}
{% block scripts %}
<script src="/static/js/risk.js" defer></script>
{% endblock %}
