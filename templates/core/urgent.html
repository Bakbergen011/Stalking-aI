{% extends "base.html" %}
{% block content %}
<article class="page">
  <h1>{{ t.urgent_title }}</h1>
  <p class="lead">{{ t.urgent_intro }}</p>
  <p class="meta">{{ t.numbers_checked }}</p>

  <ul class="phone-list">
    {% for item in numbers %}
    <li class="phone-card{% if item.emergency %} is-emergency{% endif %}">
      <div>
        <h2>{{ item.name }}</h2>
        <p>{{ item.desc }}</p>
      </div>
      <a class="call-btn" href="tel:{{ item.num }}" aria-label="{{ t.call_now }} {{ item.num }}">
        <span class="call-num">{{ item.num }}</span>
        <span>{{ t.call_now }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
